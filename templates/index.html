<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griddle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main_stylesheet.css') }}">
</head>
<body>
    <h2>Click and drag to select!</h2>

    <div id="word-display"></div>
    <div id="squares-selected-display"></div>

    <!-- Score progress bar -->
    <div id="score-container" style="margin-bottom: 20px;">
        <p id="score-display" style="text-align: center;">Current score: 0</p>
        <progress id="score-progress" value="0" max="100" style="width: 200px; height: 20px;"></progress>
    </div>

    <!-- New wrapper to position items side-by-side -->
    <div class="main-content">

        <div class="grid-wrapper">
            <svg id="line-svg">
                <polyline id="selection-line"></polyline>
            </svg>

            <div class="grid-container" style="grid-template-columns: repeat({{ size }}, 60px);">
                {% for r in range(size) %}
                    {% for c in range(size) %}
                        <div class="cell {% if grid[r][c].active == 1 %}active{% endif %}"
                             data-row="{{ r }}"
                             data-col="{{ c }}">
                            {{ grid[r][c].letter.upper() }}
                        </div>
                    {% endfor %}
                {% endfor %}
            </div>
        </div>

        <!-- The word list is now a sibling to the grid wrapper -->
        <div id="word-list-container">
            <h3>Found Words:</h3>
            <ul id="word-list" style="list-style-type: none; padding: 0; font-size: 20px;">
                {% for word in words %}
                    <li>{{ word }}</li>
                {% endfor %}
            </ul>
            <button id="reset-words-btn" style="margin-bottom: 10px;">Reset</button>
        </div>

    </div>

    <script>
        let isDragging = false;
        let selectedPath = [];

        const svgLine = document.getElementById('selection-line');
        const gridWrapper = document.querySelector('.grid-wrapper');
        const svgContainer = document.getElementById('line-svg');
        const wordDisplay = document.getElementById('word-display'); // Grab the word display element
        const squaresSelectedDisplay = document.getElementById('squares-selected-display');
        const scoreDisplay = document.getElementById('score-display');
        const scoreProgress = document.getElementById('score-progress');

        let squaresSelected = 0;
        let currentScore = 0;

        // Used when using keyboard to input for multi-letter cells
        let pendingCell = null;
        let pendingTyped = "";


        // New helper function to update the text on the screen
        function updateWordDisplay() {
            // Map over the selected cells, extract their text, remove whitespace, and join them into a string
            const currentWord = selectedPath.map(cell => cell.textContent.trim()).join('');
            wordDisplay.textContent = currentWord;
        }

        function updateSquaresSelectedDisplay () {
            squaresSelectedDisplay.textContent = "Squares selected: " + squaresSelected;
        }

        function updateCurrentScoreDisplay() {
            scoreDisplay.textContent = "Current score: " + currentScore;
            scoreProgress.value = currentScore;
            const maxHue = 120
            
            // Get the max score (fallback to 100 if not set)
            const maxScore = scoreProgress.max || 100;
            
            const hue = Math.min(currentScore, maxScore) / maxScore * maxHue;
            
            // Inject the calculated HSL color directly into the progress bar's CSS variable
            scoreProgress.style.setProperty('--progress-color', `hsl(${hue}, 100%, 50%)`);
        }

        function calculateScore(squaresSelected) {
            const baseScore = 4;
            let outputScore = baseScore;

            for (let i = 4; i < squaresSelected; i++) {
                outputScore += (i - 1);
            }

            return outputScore
        }

        function updateLine() {
            if (selectedPath.length === 0) {
                svgLine.setAttribute('points', '');
                return;
            }

            const wrapperRect = gridWrapper.getBoundingClientRect();
            svgContainer.setAttribute('viewBox', `0 0 ${wrapperRect.width} ${wrapperRect.height}`);

            const points = selectedPath.map(cell => {
                const rect = cell.getBoundingClientRect();
                const x = (rect.left - wrapperRect.left) + (rect.width / 2);
                const y = (rect.top - wrapperRect.top) + (rect.height / 2);
                return `${x},${y}`;
            });

            svgLine.setAttribute('points', points.join(' '));
        }

        function undoLastStep() {
            if (selectedPath.length === 0) return;

            const poppedCell = selectedPath.pop();
            poppedCell.classList.remove('active');
            squaresSelected -= 1;

            updateLine();
            updateWordDisplay();
            updateSquaresSelectedDisplay();

            fetch('/deactivate_cell', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    row: poppedCell.getAttribute('data-row'),
                    col: poppedCell.getAttribute('data-col')
                })
            }).catch(error => console.error('Error:', error));
        }

        function submitCurrentWord() {
            if (selectedPath.length === 0) return;

            const finalWord = wordDisplay.textContent;
            const finalSquaresSelected = squaresSelected;
            squaresSelected = 0;
            isDragging = false; // Reset dragging state

            // Clear the UI
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
            selectedPath = [];
            updateLine();
            wordDisplay.textContent = '';
            squaresSelectedDisplay.textContent = '';

            // Send the completed word to the server
            fetch('/submit_word', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ word: finalWord })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const wordListElement = document.getElementById('word-list');
                    wordListElement.innerHTML = '';
                    data.words.forEach(w => {
                        const li = document.createElement('li');
                        li.textContent = w;
                        wordListElement.appendChild(li);
                    });
                    
                    if (data.valid && !data.repeat) {
                        currentScore += calculateScore(finalSquaresSelected);
                        updateCurrentScoreDisplay();
                    }
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function handleDrag(cellElement) {
            if (!isDragging) return;

            // 1. Check for backtracking using the new helper
            if (selectedPath.length > 1 && cellElement === selectedPath[selectedPath.length - 2]) {
                undoLastStep();
                return;
            }

            // 2. Prevent redundant activation
            if (cellElement.classList.contains('active')) return;

            // 3. Adjacency Check
            const newRow = parseInt(cellElement.getAttribute('data-row'));
            const newCol = parseInt(cellElement.getAttribute('data-col'));

            if (selectedPath.length > 0) {
                const lastCell = selectedPath[selectedPath.length - 1];
                const lastRow = parseInt(lastCell.getAttribute('data-row'));
                const lastCol = parseInt(lastCell.getAttribute('data-col'));

                if (Math.abs(newRow - lastRow) > 1 || Math.abs(newCol - lastCol) > 1) {
                    return;
                }
            }

            // 4. Activate the new cell
            cellElement.classList.add('active');
            selectedPath.push(cellElement);
            squaresSelected += 1

            updateLine();
            updateWordDisplay(); // Update the word when a new cell is added
            updateSquaresSelectedDisplay();

            fetch('/activate_cell', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ row: newRow, col: newCol })
            }).catch(error => console.error('Error:', error));
        }

        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('dragstart', (e) => e.preventDefault());

            cell.addEventListener('mousedown', (e) => {
                e.preventDefault();
                isDragging = true;
                selectedPath = [];
                handleDrag(cell);
            });

            cell.addEventListener('mouseenter', () => {
                handleDrag(cell);
            });
        });

        // Code to run whenever a word is selected from the grid
        // Code to run whenever a word is selected from the grid via mouse
        document.addEventListener('mouseup', () => {
            if (isDragging) {
                submitCurrentWord();
            }
        });

        document.addEventListener('keydown', (event) => {
            const isAlphabetical = /^[a-zA-Z]+$/.test(event.key);

            // Handle typing letters
            if (event.key.length === 1 && isAlphabetical) {
                const targetLetter = event.key.toLowerCase();

                // 1. If we are currently in the middle of typing a multi-letter cell
                if (pendingCell) {
                    const cellText = pendingCell.textContent.trim().toLowerCase();
                    const newTyped = pendingTyped + targetLetter;

                    if (cellText === newTyped) {
                        // The user finished typing the multi-letter cell -> activate it
                        isDragging = true;
                        handleDrag(pendingCell);
                        pendingCell = null;
                        pendingTyped = "";
                    } else if (cellText.startsWith(newTyped)) {
                        // The user typed a correct letter, but the cell is even longer (e.g., 3+ letters)
                        pendingTyped = newTyped;
                    } else {
                        // The user typed the wrong next letter -> cancel the pending selection
                        pendingCell = null;
                        pendingTyped = "";
                    }
                    return; // Stop evaluating this keystroke
                }

                // 2. Normal matching logic (searching for a new cell)
                let possibleCells = [];

                document.querySelectorAll('.cell:not(.active)').forEach(cell => {
                    if (cell.textContent.trim().toLowerCase().startsWith(targetLetter)) {
                        const r = parseInt(cell.getAttribute('data-row'));
                        const c = parseInt(cell.getAttribute('data-col'));
                        
                        if (selectedPath.length === 0) {
                            possibleCells.push(cell);
                        } else {
                            const lastCell = selectedPath[selectedPath.length - 1];
                            const lastRow = parseInt(lastCell.getAttribute('data-row'));
                            const lastCol = parseInt(lastCell.getAttribute('data-col'));

                            if (Math.abs(r - lastRow) <= 1 && Math.abs(c - lastCol) <= 1) {
                                possibleCells.push(cell);
                            }
                        }
                    }
                });

                // 3. Process the first valid match found
                if (possibleCells.length > 0) {
                    const chosenCell = possibleCells[0];
                    const cellText = chosenCell.textContent.trim().toLowerCase();

                    if (cellText === targetLetter) {
                        // Exact match for a standard single-letter cell
                        isDragging = true; 
                        handleDrag(chosenCell); 
                    } else {
                        // Partial match for a multi-letter cell -> put it in pending mode
                        pendingCell = chosenCell;
                        pendingTyped = targetLetter;
                    }
                }
                
            } 
            // Handle Submit
            else if (event.key === 'Enter') {
                submitCurrentWord();
                pendingCell = null;
                pendingTyped = "";
            } 
            // Handle Backspace
            else if (event.key === 'Backspace') {
                if (pendingCell) {
                    // If we backspace while typing "QU", just cancel the pending "Q"
                    pendingCell = null;
                    pendingTyped = "";
                } else {
                    // Otherwise, undo the last fully selected cell
                    undoLastStep();
                }
            }
        });

        document.getElementById('reset-words-btn').addEventListener('click', (event) => {
            event.preventDefault(); // 1. Prevent the browser from refreshing the page

            fetch('/reset_words', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' } // 2. Tell Flask to accept this safely
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Clear the words from the webpage visually
                    document.getElementById('word-list').innerHTML = '';

                    // Update score to 0
                    currentScore = 0;
                    updateCurrentScoreDisplay();
                }
            })
            .catch(error => console.error('Error:', error));

            event.currentTarget.blur()
        });
    </script>
</body>
</html>
